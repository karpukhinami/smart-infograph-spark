services:
  - type: web
    name: smart-infographics-generator
    runtime: node
    buildCommand: bun install && bun run build
    startCommand: bash render-start.sh
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: NITRO_PRESET
        value: render_com
